<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura & Frame</title>
    <link rel="icon" type="image/png" href="aflogo.png">
    <style>
        body{
            margin: 0;
            background-color: #FFFDF9;
        }
        nav{
            display: flex;
            align-items: center;
            padding: 10px 50px;
            border-bottom: 1px solid #C79A3B;
            background-color: #FFFDF9;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .aflogo{
            display: flex;
            align-items: center;
            flex-grow: 1;
        }
        .aflogo img{
            width: 80px;
            height: 80px;
            object-fit: contain;
            margin-right: 15px;
        }
        .aflogo h1{
            color: #1A1A1A;
            font-family: Garamond, Georgia, serif;
            font-size: 42px;
            letter-spacing: 3px;
            margin: 0;
            font-weight: normal;
        }
        .af{
            display: flex;
            gap: 35px;
            align-items: center;
        }
        .af a{
            font-size: 24px;
            color: #1A1A1A;
            text-decoration: none;
            font-family: Garamond, Georgia, serif;
            transition: 0.3s;
        }
        .af a:hover{
            color: #C79A3B;
            transform: translateY(-2px);
        }
        .hero{
            text-align: center;
            margin-top: 20px;
        }
        .hero img{
            width: 95%;
            height: auto;
            display: block;
            margin: auto;
        }
        .copyright{
            background-color: #FFFDF9;
            border-top: 1px solid #C79A3B;
            text-align: center;
            padding: 20px;
        }
        .copyright img{
            width: 60px;
            height: 60px;
            object-fit: contain;
        }
        .copyright p{
            font-family: Georgia, serif;
            font-size: 16px;
            color: #1A1A1A;
            margin: 5px 0 0;
        }
    </style>
</head>
<body>
    <nav>
        <div class="aflogo">
            <img src="a&flogo.png" alt="Aura & Frame logo">
            <h1>Aura & Frame</h1>
        </div>
        <div class="af">
            <a href="af.html">Home</a>
            <a href="about.html">About</a>
            <a href="services.html">Services</a>
            <a href="gallery.html">Gallery</a>
            <a href="contact.html">Contact</a>
            <a href="">Careers</a>
        </div>
    </nav>
    <div class="hero">
            <img src="af_heroimage.png" alt="Aura & Frame-hero-image">
        </div>
        <div class="about-heading">
    <footer class="copyright">
    <img src="a&flogo.png" alt="Aura & Frame Logo">
    <p>&copy; 2026 Aura & Frame. All Rights Reserved.</p>
</footer>
</body>
</html>
